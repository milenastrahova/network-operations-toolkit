name: Tests and install smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q netops tests
      - name: Offline tests
        run: python -m unittest discover -v
      - name: Release manifest audit
        run: python scripts/release_audit.py
      - name: Install CLI package
        run: python -m pip install --no-deps .
      - name: Installed entrypoint version
        run: netops --version
      - name: Packaged FRR inventory smoke
        run: python scripts/install_smoke.py
